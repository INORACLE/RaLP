plugins {
    id 'fabric-loom' version '1.13.6'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Nested inside the mod jar, so server admins do not have to install it separately
    include(modImplementation("me.lucko:fabric-permissions-api:${project.permissions_api_version}"))
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'ralp',
            'Specification-Version'  : project.version,
            'Implementation-Title'   : 'RaLP',
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : 'Hantu'
        ])
    }
}