plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = 'ru.hantu'
version = '0.0.1'

base {
    archivesName = 'RaLP-NeoForge-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.250'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        ralp {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'ralp',
            'Specification-Version'  : project.version,
            'Implementation-Title'   : 'RaLP',
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : 'Hantu'
        ])
    }
}